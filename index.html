<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a7d4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>تاجر - إدارة الطلبات</title>
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#1b1f24;--m:#667;--p:#0a7d4f;--b:#dde1e6;--bst:#e6f6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--c:#1e2327;--t:#eceff1;--m:#9aa5ad;--b:#333b41;--p:#2ecc8f;--bst:#183326}}
:root[data-theme="dark"]{--bg:#14171a;--c:#1e2327;--t:#eceff1;--m:#9aa5ad;--b:#333b41;--p:#2ecc8f;--bst:#183326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,Arial,sans-serif;font-size:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:20px;padding:8px 14px}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
main{padding:8px 10px 40px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 0}
.row.best{background:var(--bst);border-radius:8px;padding:5px}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:16px}
button,.btn{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:9px 12px;font-size:15px;text-decoration:none;display:inline-block}
.pri{background:var(--p);color:#fff;border-color:var(--p)}
.x{color:#c0392b}
.cnt{white-space:nowrap;background:var(--p);color:#fff;border-radius:20px;padding:8px 12px;font-weight:bold}.warn{background:#b3261e;color:#fff;border-radius:8px;padding:6px}small{color:var(--m)}h3{margin:12px 0 4px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:right}
textarea{width:100%;height:140px;box-sizing:border-box;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:9}
@media print{.np,#toast{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff;color:#000}td,th{color:#000}.row.best{background:#e6f6ee!important}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
let db={products:[],suppliers:[],clients:[],orders:[]},tab='orders',sel={},view=null,armed='',draft={cid:'',items:[]};
try{const s=localStorage.getItem('tajer');if(s)db=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('tajer',JSON.stringify(db))}catch(e){}};
const $=i=>document.getElementById(i);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g=(a,id)=>a.find(x=>x.id===id);
const fmt=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2});
const best=p=>p.prices.length?p.prices.reduce((a,b)=>b.price<a.price?b:a):null;
const ST=()=>db.settings||{};
const pl=p=>p.name+' — '+(+p.sell?fmt(p.sell):(best(p)?fmt(best(p).price)+' (شراء)':'بدون سعر'));
const sub=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);
const tot=o=>sub(o)-(+o.discount||0);
const cn=o=>({k:new Set(o.items.map(i=>i.pid)).size,q:o.items.reduce((a,i)=>a+i.qty,0)});
const sumHTML=(items,dis)=>{const t=items.reduce((a,i)=>a+i.qty*i.price,0),k=new Set(items.map(i=>i.pid)).size,q=items.reduce((a,i)=>a+i.qty,0),m=+dis||0,a=autoDisc(items,draft.cid),d=m+a.amt;let h=`<div class="card" style="margin:4px 0"><div class="row"><span>عدد الأصناف</span><b>${k}</b></div><div class="row"><span>عدد القطع</span><b>${q}</b></div><div class="row"><span>الإجمالي</span><b>${fmt(t)}</b></div>`;
if(a.on){h+=`<div class="row"><span>🎁 قطع قابلة للخصم</span><b>${a.u}</b></div>`;if(a.amt)h+=`<div class="row"><span>خصم الكمية (${a.ue} × ${fmt(a.r)})</span><b>- ${fmt(a.amt)}</b></div>`;if(a.next&&a.u>0){h+=`<small>💡 باقي ${a.next[0]-a.u} قطعة قابلة للخصم للوصول إلى ${fmt(a.next[1]*a.f)} جنيه خصم للقطعة</small>`}}
if(m)h+=`<div class="row"><span>خصم يدوي</span><b>- ${fmt(m)}</b></div>`;
if(d)h+=`<div class="row best"><span>الإجمالي بعد الخصم</span><b>${fmt(t-d)}</b></div>`;return h+'</div>'};
function selHTML(t){const os=db.orders.filter(o=>sel[o.id]);if(!os.length)return '';const its=os.flatMap(o=>o.items),k=new Set(its.map(i=>i.pid)).size,q=its.reduce((a,i)=>a+i.qty,0),tt=os.reduce((a,o)=>a+tot(o),0),d=os.reduce((a,o)=>a+(+o.discount||0),0);return `<div class="card"><b>${t}: ${os.length}</b><div class="row"><span>عدد الأصناف</span><b>${k}</b></div><div class="row"><span>عدد القطع</span><b>${q}</b></div>`+(d?`<div class="row"><span>مجموع الخصومات</span><b>- ${fmt(d)}</b></div>`:'')+`<div class="row best"><span>الإجمالي${d?' بعد الخصم':''}</span><b>${fmt(tt)}</b></div></div>`}
function ssum(){const e=$('ssum');if(e)e.innerHTML=selHTML('📌 الفواتير المحددة');saveUI()}
function dsum(){const e=$('dsum');if(e)e.innerHTML=draft.items.length?sumHTML(draft.items,draft.dis):'';saveUI()}
/*V25*/
let impRes=null;
function repsList(){return db.reps||(db.reps=[])}
function addRep(){const n=$('rp_n').value.trim(),c=$('rp_c').value.trim().toUpperCase();if(!n||!c)return toast('اكتب اسم المندوب وكوده');if(repsList().some(r=>r.code===c))return toast('الكود مستخدم');repsList().push({id:uid(),name:n,code:c,cids:[]});save();render()}
function delRep(id){if(armed!==id){armed=id;render();return}armed='';db.reps=db.reps.filter(r=>r.id!==id);save();render()}
function repCids(id,cid,v){const r=db.reps.find(x=>x.id===id);r.cids=r.cids.filter(x=>x!==cid);if(v)r.cids.push(cid);save();const e=$('rc'+id);if(e)e.textContent=r.cids.length+' عميل'}
function buildPkg(rid){const r=db.reps.find(x=>x.id===rid),cs=db.clients.filter(c=>r.cids.includes(c.id)&&!c.blocked).map(c=>({id:c.id,name:c.name,phone:c.phone,addr:c.addr,zone:c.zone||'',dcls:c.dcls||''}));return{kngsales:1,t:Date.now(),rep:{code:r.code,name:r.name},owner:ST().ph||'',products:db.products.map(p=>({id:p.id,name:p.name,sell:+p.sell||0,disc:!!p.disc,cat:catName(p.cat)})),clients:cs,disc:DD()}}
async function sharePkg(rid){const r=db.reps.find(x=>x.id===rid);if(!r.cids.length)return toast('اختر عملاء المندوب أولاً');const pw=$('rpw'+rid).value;let txt=JSON.stringify(buildPkg(rid));if(pw){if(pw.length<4)return toast('كلمة السر 4 أحرف على الأقل');txt=await encObj(pw,JSON.parse(txt))}const f=new File([txt],'KNG-sales-'+r.code+'-'+new Date().toISOString().slice(0,10)+'.txt',{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'KNG sales package'});return}}catch(e){if(e&&e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('تم حفظ الحزمة في التنزيلات')}
function missingSeq(code){const q=(db.repSeen||{})[code]||[],mx=Math.max(0,...q),m=[];for(let i=1;i<=mx;i++)if(!q.includes(i))m.push(i);return m}
function importRepOrders(txt){const out={ok:0,dup:0,err:[],fix:0,miss:[]},codes=new Set(),lines=String(txt).split(/\r?\n/).map(l=>l.trim()).filter(l=>l.indexOf('KNGORD:')===0);
lines.forEach(l=>{let o;try{o=JSON.parse(l.slice(7))}catch(e){out.err.push('سطر غير مفهوم');return}
if(db.orders.some(x=>x.id===o.id)){out.dup++;return}
const r=(db.reps||[]).find(x=>x.code===o.r);if(!r){out.err.push('مندوب غير معروف: '+o.r);return}
if(!r.cids.includes(o.c)||!g(db.clients,o.c)){out.err.push('#'+o.n+': عميل غير مخصص للمندوب');return}
const items=[];let bad=false;(o.i||[]).forEach(([pid,q,pr])=>{const p=g(db.products,pid);if(!p||!(+q>0)){bad=true;return}let price=+pr;if(+p.sell>0&&price!==+p.sell){out.fix++;price=+p.sell}const b=best(p);items.push({pid,qty:+q,price,cost:b?b.price:0})});
if(bad||!items.length){out.err.push('#'+o.n+': منتج غير موجود أو كمية خاطئة');return}
db.shifts=db.shifts||[];let sh=db.shifts.find(x=>!x.end);if(!sh){sh={id:uid(),start:Date.now(),end:null};db.shifts.push(sh)}
const au=autoDisc(items,o.c);db.orders.push({id:o.id,cid:o.c,date:o.d,items,discount:au.amt,man:0,auto:au.amt,adet:{u:au.ue,r:au.r},note:'',rep:r.code,repName:r.name,seq:o.n,sid:sh.id});
db.repSeen=db.repSeen||{};(db.repSeen[r.code]=db.repSeen[r.code]||[]).push(o.n);codes.add(r.code);out.ok++});
codes.forEach(c=>{const m=missingSeq(c);if(m.length)out.miss.push(c+': '+m.join(','))});save();return out}
function doImportOrders(){impRes=importRepOrders($('io_txt').value);render()}
/*V24*/
let dupW=null,dupE=null;
const hasDup=a=>new Set(a.map(i=>i.pid)).size<a.length;
function dupHTML(){const w=dupW;if(!w||!draft.items[w.ex])return '';const l=draft.items[w.ex],p=g(db.products,w.pid);return `<div class="warn card"><b>⚠️ تنبيه: "${esc(p?p.name:'?')}" موجود في الطلب بالفعل</b><div>الموجود: ${l.qty} × ${fmt(l.price)}</div><div>الجديد: ${w.q} × ${fmt(w.pr)}</div><div class="row"><button onclick="dupDo('m')">➕ ادمج (يصبح ${l.qty+w.q})</button><button onclick="dupDo('r')">🔁 استبدل بـ ${w.q}</button></div><div class="row"><button onclick="dupDo('s')">سطر منفصل</button><button onclick="dupDo('c')">✖ إلغاء</button></div></div>`}
function addItem(){const pid=$('ip').value,q=+$('iq').value;if(!pid||!(q>0))return toast('اختر المنتج والكمية');const p=g(db.products,pid),b=best(p),pr=+$('ipr').value||+p.sell||(b?b.price:0),ex=draft.items.findIndex(i=>i.pid===pid);if(ex>=0){dupW={pid,q,pr,cost:b?b.price:0,ex};render();return toast('⚠️ هذا المنتج موجود في الطلب بالفعل')}draft.items.push({pid,qty:q,price:pr,cost:b?b.price:0});dupW=null;render()}
function dupDo(a){const w=dupW;if(!w)return;const l=draft.items[w.ex];if(a==='m'&&l)l.qty+=w.q;else if(a==='r'&&l){l.qty=w.q;l.price=w.pr}else if(a==='s')draft.items.push({pid:w.pid,qty:w.q,price:w.pr,cost:w.cost});dupW=null;render()}
function mergeDups(){const m=[];draft.items.forEach(i=>{const e=m.find(x=>x.pid===i.pid&&x.price===i.price);if(e)e.qty+=i.qty;else m.push({...i})});draft.items=m;dupW=null;render()}
function edupHTML(o){const w=dupE;if(!w||!o.items[w.ex])return '';const l=o.items[w.ex],p=g(db.products,w.it.pid);return `<div class="warn card"><b>⚠️ تنبيه: "${esc(p?p.name:'?')}" موجود في الفاتورة بالفعل</b><div>الموجود: ${l.qty} × ${fmt(l.price)}</div><div>الجديد: ${w.it.qty} × ${fmt(w.it.price)}</div><div class="row"><button onclick="edupDo('m')">➕ ادمج (يصبح ${l.qty+w.it.qty})</button><button onclick="edupDo('r')">🔁 استبدل بـ ${w.it.qty}</button></div><div class="row"><button onclick="edupDo('s')">سطر منفصل</button><button onclick="edupDo('c')">✖ إلغاء</button></div></div>`}
function itemAdd(){const o=g(db.orders,view);applyEdits(o);const pid=$('eap').value,q=+$('eaq').value;if(!pid||!(q>0))return toast('اختر المنتج والكمية');const p=g(db.products,pid),b=best(p),it={pid,qty:q,price:+$('eapr').value||+p.sell||(b?b.price:0),cost:b?b.price:0},ex=o.items.findIndex(i=>i.pid===pid);if(ex>=0){dupE={it,ex};save();render();return toast('⚠️ هذا المنتج موجود في الفاتورة بالفعل')}o.items.push(it);dupE=null;recalcDisc(o);save();render()}
function edupDo(a){const o=g(db.orders,view),w=dupE;if(!w)return;const l=o.items[w.ex];if(a==='m'&&l)l.qty+=w.it.qty;else if(a==='r'&&l){l.qty=w.it.qty;l.price=w.it.price}else if(a==='s')o.items.push(w.it);dupE=null;recalcDisc(o);save();render()}
/*V23*/
const PH={};
const ph=(pid,z)=>PH[pid]?`<img src="${PH[pid]}" width="${z}" height="${z}" style="border-radius:6px;object-fit:cover;flex:none">`:'';
function idb(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej();const r=indexedDB.open('kng-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function phSet(pid,data){PH[pid]=data;try{const d=await idb();d.transaction('p','readwrite').objectStore('p').put(data,pid)}catch(e){}}
async function phDel(pid){delete PH[pid];try{const d=await idb();d.transaction('p','readwrite').objectStore('p').delete(pid)}catch(e){}}
async function phReplace(o){Object.keys(PH).forEach(k=>delete PH[k]);try{const d=await idb();d.transaction('p','readwrite').objectStore('p').clear()}catch(e){}for(const k of Object.keys(o||{}))await phSet(k,o[k])}
async function phLoad(){try{const d=await idb();await new Promise(res=>{const rq=d.transaction('p').objectStore('p').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()})}catch(e){}render()}
function phDelUI(pid){phDel(pid).then(()=>{toast('تم حذف الصورة');render()})}
function photoPick(pid,cam){const i=document.createElement('input');i.type='file';i.accept='image/*';if(cam)i.setAttribute('capture','environment');i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const S=200,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);const sc=Math.min(S/im.width,S/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(S-w)/2,(S-h)/2,w,h);URL.revokeObjectURL(u);phSet(pid,c.toDataURL('image/jpeg',0.7)).then(()=>{toast('تم حفظ الصورة ✔');render()})};im.onerror=()=>toast('تعذر قراءة الصورة');im.src=u};i.click()}
async function applyBackup(d){let photos=null;if(d&&d.kngfull){photos=d.photos||{};d=d.db}if(!d||!d.products||!d.clients||!d.suppliers||!d.orders)throw 0;db=d;save();if(photos)await phReplace(photos);toast('تم الاسترجاع ✔'+(photos?' مع الصور':''));render()}
async function shareBkFull(){const f=new File([JSON.stringify({kngfull:1,db,photos:PH})],'KNG-full-backup-'+new Date().toISOString().slice(0,10)+'.txt',{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'KNG full backup'});return}}catch(e){if(e&&e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('تم حفظ الملف في التنزيلات')}
/*V22*/
const DD=()=>{const d=ST().disc||{};return{on:d.on!==false,tiers:d.tiers||[[10,1],[20,2],[30,3],[40,4],[50,5]],cls:d.cls||[{id:'c1',n:'عميل مميز',f:1},{id:'c2',n:'عميل عادي',f:0.5}],cap:d.cap!==false}};
const pkey=p=>p.name+' '+(p.barcode||'')+' '+(p.bcCarton||'')+' '+catName(p.cat);
const bcn=s=>String(s||'').replace(/\D/g,'').replace(/^0+/,'');
function autoDisc(items,cid){const D=DD(),c=g(db.clients,cid),cl=c&&D.cls.find(x=>x.id===c.dcls),f=cl?+cl.f:0;let u=0;items.forEach(i=>{const p=g(db.products,i.pid);if(p&&p.disc)u+=+i.qty});
const T=D.tiers.map(t=>[+t[0],+t[1]]).filter(t=>t[0]>0&&t[1]>0).sort((a,b)=>a[0]-b[0]);let r=0,nx=null;const top=T.length?T[T.length-1][0]:0;T.forEach(t=>{if(u>=t[0])r=t[1];else if(nx===null)nx=t});
const ue=D.cap&&top&&u>top?top:u,on=D.on&&f>0,amt=on&&r>0?Math.round(ue*r*f*100)/100:0;return{u,ue,r:r*f,amt,next:nx,f,on}}
function recalcDisc(o){const s=sub(o);if(o.auto!==undefined){const a=autoDisc(o.items,o.cid);o.auto=a.amt;o.adet={u:a.ue,r:a.r};o.discount=Math.min(s,a.amt+(+o.man||0))}else if((+o.discount||0)>s)o.discount=s}
function setDisc(pid,v){g(db.products,pid).disc=v==='1';save();render()}
function bulkDisc(v){const k='bd'+v;if(armed!==k){armed=k;render();return}armed='';prodList().forEach(p=>p.disc=!!v);save();toast('تم التحديث ✔');render()}
function setCls(cid,v){g(db.clients,cid).dcls=v;save();render()}
function discCard(){const D=DD(),tr=[0,1,2,3,4].map(i=>{const t=D.tiers[i]||['',''];return `<div class="row" style="flex-wrap:nowrap"><span>من</span><input id="dt_u${i}" type="number" inputmode="numeric" value="${esc(t[0])}" style="width:80px"><span>قطعة ←</span><input id="dt_a${i}" type="number" inputmode="decimal" step="any" value="${esc(t[1])}" style="width:80px"><span>ج/قطعة</span></div>`}).join('');
const cl=[0,1,2].map(i=>{const c=D.cls[i]||{n:'',f:''};return `<div class="row" style="flex-wrap:nowrap"><input id="dc_n${i}" value="${esc(c.n)}" placeholder="اسم الفئة" style="flex:1;min-width:0"><input id="dc_f${i}" type="number" inputmode="decimal" step="any" value="${esc(c.f)}" placeholder="المعامل" style="width:80px"></div>`}).join('');
