<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a7d4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>تاجر - إدارة الطلبات</title>
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#1b1f24;--m:#667;--p:#0a7d4f;--b:#dde1e6;--bst:#e6f6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--c:#1e2327;--t:#eceff1;--m:#9aa5ad;--b:#333b41;--p:#2ecc8f;--bst:#183326}}
:root[data-theme="dark"]{--bg:#14171a;--c:#1e2327;--t:#eceff1;--m:#9aa5ad;--b:#333b41;--p:#2ecc8f;--bst:#183326}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,Arial,sans-serif;font-size:16px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:20px;padding:8px 14px}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
main{padding:8px 10px 40px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:5px 0}
.row.best{background:var(--bst);border-radius:8px;padding:5px}
input,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:16px}
button,.btn{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:9px 12px;font-size:15px;text-decoration:none;display:inline-block}
.pri{background:var(--p);color:#fff;border-color:var(--p)}
.x{color:#c0392b}
.cnt{white-space:nowrap;background:var(--p);color:#fff;border-radius:20px;padding:8px 12px;font-weight:bold}small{color:var(--m)}h3{margin:12px 0 4px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:right}
textarea{width:100%;height:140px;box-sizing:border-box;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px}
#toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:9}
@media print{.np,#toast{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff;color:#000}td,th{color:#000}.row.best{background:#e6f6ee!important}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
let db={products:[],suppliers:[],clients:[],orders:[]},tab='orders',sel={},view=null,armed='',draft={cid:'',items:[]};
try{const s=localStorage.getItem('tajer');if(s)db=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('tajer',JSON.stringify(db))}catch(e){}};
const $=i=>document.getElementById(i);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g=(a,id)=>a.find(x=>x.id===id);
const fmt=n=>(+n||0).toLocaleString('en',{maximumFractionDigits:2});
const best=p=>p.prices.length?p.prices.reduce((a,b)=>b.price<a.price?b:a):null;
const ST=()=>db.settings||{};
const pl=p=>p.name+' — '+(+p.sell?fmt(p.sell):(best(p)?fmt(best(p).price)+' (شراء)':'بدون سعر'));
const sub=o=>o.items.reduce((s,i)=>s+i.qty*i.price,0);
const tot=o=>sub(o)-(+o.discount||0);
const cn=o=>({k:new Set(o.items.map(i=>i.pid)).size,q:o.items.reduce((a,i)=>a+i.qty,0)});
const sumHTML=(items,dis)=>{const t=items.reduce((a,i)=>a+i.qty*i.price,0),k=new Set(items.map(i=>i.pid)).size,q=items.reduce((a,i)=>a+i.qty,0),d=+dis||0;return `<div class="card" style="margin:4px 0"><div class="row"><span>عدد الأصناف</span><b>${k}</b></div><div class="row"><span>عدد القطع</span><b>${q}</b></div><div class="row"><span>الإجمالي</span><b>${fmt(t)}</b></div>`+(d?`<div class="row"><span>الخصم</span><b>- ${fmt(d)}</b></div><div class="row best"><span>الإجمالي بعد الخصم</span><b>${fmt(t-d)}</b></div>`:'')+'</div>'};
function selHTML(t){const os=db.orders.filter(o=>sel[o.id]);if(!os.length)return '';const its=os.flatMap(o=>o.items),k=new Set(its.map(i=>i.pid)).size,q=its.reduce((a,i)=>a+i.qty,0),tt=os.reduce((a,o)=>a+tot(o),0),d=os.reduce((a,o)=>a+(+o.discount||0),0);return `<div class="card"><b>${t}: ${os.length}</b><div class="row"><span>عدد الأصناف</span><b>${k}</b></div><div class="row"><span>عدد القطع</span><b>${q}</b></div>`+(d?`<div class="row"><span>مجموع الخصومات</span><b>- ${fmt(d)}</b></div>`:'')+`<div class="row best"><span>الإجمالي${d?' بعد الخصم':''}</span><b>${fmt(tt)}</b></div></div>`}
function ssum(){const e=$('ssum');if(e)e.innerHTML=selHTML('📌 الفواتير المحددة')}
function dsum(){const e=$('dsum');if(e)e.innerHTML=draft.items.length?sumHTML(draft.items,draft.dis):''}
/*V18*/
let poSel={},poView=null,poSup='',poAs={};
const KN={h:'ثقيل',n:'عادي',f:'خفيف وهش'};
function setKind(pid,v){g(db.products,pid).kind=v;save()}
function hav(a,b){const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function geoOf(c){if(!c)return null;if(c.lat&&c.lng)return{lat:+c.lat,lng:+c.lng};let t=String(c.addr||'');try{t=decodeURIComponent(t)}catch(e){}const m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/(-?\d{1,2}\.\d{3,})\s*[,،\s]\s*(-?\d{1,3}\.\d{3,})/);if(!m)return null;const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?{lat:a,lng:b}:null}
function here(cb){if(!navigator.geolocation)return toast('الموقع غير مدعوم');toast('جاري تحديد موقعك…');navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),()=>toast('تعذر تحديد الموقع، فعّل الموقع واسمح للمتصفح'),{enableHighAccuracy:true,timeout:20000,maximumAge:30000})}
function saveGeo(cid){here(p=>{const c=g(db.clients,cid);c.lat=p.lat;c.lng=p.lng;save();toast('تم حفظ موقع العميل ✔');render()})}
function plan(os,from){const by={};os.forEach(o=>(by[o.cid]=by[o.cid]||[]).push(o));const all=Object.keys(by).map(cid=>({cid,g:geoOf(g(db.clients,cid))})),wg=all.filter(x=>x.g),ng=all.filter(x=>!x.g);let cur=from||(wg[0]&&wg[0].g);const ord=[];while(wg.length){let bi=0,bd=1e9;wg.forEach((x,i)=>{const d=cur?hav(cur,x.g):0;if(d<bd){bd=d;bi=i}});const x=wg.splice(bi,1)[0];ord.push(x.cid);cur=x.g}return{cids:ord.concat(ng.map(x=>x.cid)),ids:os.map(o=>o.id)}}
function startDelivery(){const os=db.orders.filter(o=>sel[o.id]);if(!os.length)return;const go=p=>{db.trip={...plan(os,p),done:{},t:Date.now()};save();tab='deliver';render()};if(!navigator.geolocation)return go(null);toast('جاري تحديد موقعك…');navigator.geolocation.getCurrentPosition(p=>go({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{toast('بدون موقعك: الترتيب يبدأ من أول عميل');go(null)},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
function replan(){const t=db.trip;here(p=>{const os=db.orders.filter(o=>t.ids.includes(o.id)&&!t.done[o.cid]),np=plan(os,p),dn=t.cids.filter(c=>t.done[c]);t.cids=np.cids.concat(dn);save();render()})}
function dlvDone(cid){db.trip.done[cid]=!db.trip.done[cid];save();render()}
function loadPlan(){const t=db.trip,os=db.orders.filter(o=>t.ids.includes(o.id)),so={};t.cids.forEach((c,i)=>so[c]=i);const L=[];os.forEach(o=>o.items.forEach(i=>{const p=g(db.products,i.pid);L.push({stop:so[o.cid],name:p?p.name:'?',q:i.qty,k:(p&&p.kind)||'n',mv:0})}));const K={h:0,n:1,f:2};L.sort((a,b)=>b.stop-a.stop||K[a.k]-K[b.k]);for(let i=0;i<L.length;i++){if(L[i].k!=='f')continue;let hi=-1;L.forEach((x,j)=>{if(x.k==='h'&&j>i)hi=j});if(hi>i){const f=L.splice(i,1)[0];L.splice(hi,0,f);f.mv=1;i--}}return L}
function poLines(){const agg={};db.orders.filter(o=>sel[o.id]).forEach(o=>o.items.forEach(i=>agg[i.pid]=(agg[i.pid]||0)+i.qty));return Object.entries(agg).map(([pid,q])=>({pid,q,p:g(db.products,pid)})).filter(x=>x.p&&poSel[x.pid]!==false)}
function poAll(v){db.orders.filter(o=>sel[o.id]).forEach(o=>o.items.forEach(i=>poSel[i.pid]=!!v));render()}
function openPO(){if(!poSup)return toast('اختر التاجر أولاً');const ls=poLines();if(!ls.length)return toast('علّم ✔ على منتج واحد على الأقل');ls.forEach(x=>poAs[x.pid]=poSup);poView=poSup;render()}
function poHTML(){const s=g(db.suppliers,poView)||{},ls=poLines(poView),q=ls.reduce((a,x)=>a+x.q,0),T=ST();const txt=[T.n1,T.n2,T.ph].filter(Boolean).join('\n')+'\n\nطلب شراء\nالتاجر: '+(s.name||'')+'\n'+ls.map(x=>`${x.p.name} × ${x.q}`).join('\n')+`\n\nعدد الأصناف: ${ls.length}\nعدد القطع: ${q}`;
return `<main><div class="np row"><button onclick="poView=null;render()">⬅ رجوع</button><button class="pri" onclick="window.print()">🖨 حفظ PDF</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa(s.phone)}?text=${encodeURIComponent(txt)}">🟢 واتساب</a></div>${T.n1?'':'<div class="np card"><b>⚠️ أدخل اسم النشاط من تبويب ⚙️ إعدادات</b></div>'}<div class="card"><div style="text-align:center"><div style="font-size:22px;font-weight:bold">${esc(T.n1)}</div><div style="font-size:18px;font-weight:bold">${esc(T.n2)}</div><div>${esc(T.ph)}</div></div><h3 style="text-align:center">طلب شراء / إذن شراء</h3><p>التاجر: <b>${esc(s.name)}</b><br>التاريخ: ${dt(Date.now())}</p><table><tr><th>الصنف</th><th>الكمية</th></tr>${ls.map(x=>`<tr><td>${esc(x.p.name)}</td><td>${x.q}</td></tr>`).join('')}</table><div class="row"><span>عدد الأصناف</span><b>${ls.length}</b></div><div class="row"><span>عدد القطع</span><b>${q}</b></div></div></main>`}
/*SH*/
let repId=null;
const tm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),dt=t=>new Date(t).toLocaleDateString('en-GB');
function rep(os){const its=os.flatMap(o=>o.items),sb=os.reduce((a,o)=>a+sub(o),0),d=os.reduce((a,o)=>a+(+o.discount||0),0);return {n:os.length,pcs:its.reduce((a,i)=>a+i.qty,0),cls:new Set(its.map(i=>i.pid)).size,t:sb,d,net:sb-d}}
function repHTML(sh){const r=rep(db.orders.filter(o=>o.sid===sh.id));return `<div class="card"><h3>📋 تقرير الوردية</h3><small>${dt(sh.start)} · ${tm(sh.start)} ← ${sh.end?tm(sh.end):'...'}</small><div class="row"><span>عدد الفواتير</span><b>${r.n}</b></div><div class="row best"><span>إجمالي عدد القطع المباعة</span><b>${r.pcs}</b></div><div class="row best"><span>إجمالي عدد الأصناف المباعة</span><b>${r.cls}</b></div><div class="row"><span>إجمالي المبيعات</span><b>${fmt(r.t)}</b></div>`+(r.d?`<div class="row"><span>الخصومات</span><b>- ${fmt(r.d)}</b></div>`:'')+`<div class="row"><span>الصافي بعد الخصم</span><b>${fmt(r.net)}</b></div></div>`}
function shiftCard(){const a=(db.shifts||[]).find(x=>!x.end),rp=repId&&(db.shifts||[]).find(x=>x.id===repId);let h='';
if(rp)h+=repHTML(rp)+'<button onclick="repId=null;render()">إغلاق التقرير ✔</button>';
if(a){const s=rep(db.orders.filter(o=>!o.arch));h+=`<div class="card"><div class="row"><b>🟢 وردية شغالة منذ ${tm(a.start)}</b><button class="x" onclick="endShift()">${armed==='sh'?'تأكيد الإنهاء؟':'⏹ إنهاء الوردية'}</button></div><small>${s.n} فاتورة · ${s.pcs} قطعة · ${s.cls} صنف · الصافي ${fmt(s.net)}</small></div>`}
else h+=`<div class="card"><div class="row"><b>⚪ لا توجد وردية شغالة</b><button class="pri" onclick="startShift()">▶ بدء الوردية</button></div></div>`;
return h}
function startShift(){db.shifts=db.shifts||[];if(db.shifts.some(x=>!x.end))return;db.shifts.push({id:uid(),start:Date.now(),end:null});repId=null;save();render()}
function endShift(){const a=(db.shifts||[]).find(x=>!x.end);if(!a)return;if(armed!=='sh'){armed='sh';render();return}armed='';const os=db.orders.filter(o=>!o.arch);if(!os.length){db.shifts=db.shifts.filter(x=>x!==a);save();render();return toast('لا توجد فواتير، أُلغيت الوردية')}os.forEach(o=>{o.arch=true;if(!o.sid)o.sid=a.id});a.end=Date.now();sel={};repId=a.id;save();render()}
/*END*/
let topD=30,topS='q';
function topRows(){const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),m={};let first=t0;
db.orders.forEach(o=>{const [d,mo,y]=String(o.date).split('/').map(Number),od=new Date(y,mo-1,d);if(isNaN(od))return;if(od<first)first=od;const age=Math.round((t0-od)/864e5);if(topD&&age>=topD)return;o.items.forEach(i=>{const r=m[i.pid]||(m[i.pid]={pid:i.pid,q:0,v:0,n:0,last:od});r.q+=i.qty;r.v+=i.qty*i.price;r.n++;if(od>r.last)r.last=od})});
const span=topD||Math.max(1,Math.round((t0-first)/864e5)+1);
return Object.values(m).map(r=>({...r,w:r.q/span*7})).sort((a,b)=>topS==='v'?b.v-a.v:topS==='n'?b.n-a.n:b.q-a.q).slice(0,100)}
function saveSt(){db.settings={n1:$('st_n1').value.trim(),n2:$('st_n2').value.trim(),ph:$('st_ph').value.trim()};save();toast('تم الحفظ ✔')}
function setDis(){const o=g(db.orders,view),v=+$('bd').value||0;if(v<0||v>sub(o))return toast('الخصم غير صحيح');o.discount=v;save();render()}
async function shareBk(){const f=new File([JSON.stringify(db)],'KNG-backup-'+new Date().toISOString().slice(0,10)+'.txt',{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'KNG backup'});return}}catch(e){if(e&&e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('تم حفظ الملف في التنزيلات')}
function loadBk(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.clients||!d.suppliers||!d.orders)throw 0;db=d;save();toast('تم الاسترجاع ✔');render()}catch(e){toast('الملف غير صحيح')}};r.readAsText(f)}
const tel=n=>n?`<a class="btn" href="tel:${esc(n)}">📞 ${esc(n)}</a>`:'';
const isU=l=>/^https?:\/\//i.test(String(l||'').trim());
const locTxt=l=>isU(l)?'':esc(l);
const map=l=>{l=String(l||'').trim();if(!l)return '';const u=isU(l)?l:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l);return `<a class="btn" target="_blank" rel="noopener" href="${esc(u)}">📍 خريطة</a>`};
function flt(v){v=v.trim().toLowerCase();let n=0;document.querySelectorAll('[data-f]').forEach(e=>{const ok=(e.dataset.f||e.textContent).toLowerCase().includes(v);e.style.display=ok?'':'none';if(ok)n++});const c=$('cnt');if(c)c.textContent='العدد: '+(v?n+' من '+db[tab].length:db[tab].length)}
function fsel(v){v=v.trim().toLowerCase();$('ip').innerHTML=db.products.filter(p=>p.name.toLowerCase().includes(v)).map(p=>`<option value="${p.id}">${esc(pl(p))}</option>`).join('');pinfo()}
function fcl(v){v=v.trim().toLowerCase();const s=$('ic');const l=db.clients.filter(c=>c.name.toLowerCase().includes(v));s.innerHTML=(v?'':'<option value="">— اختر العميل —</option>')+l.map(c=>`<option value="${c.id}" ${c.id===draft.cid?'selected':''}>${esc(c.name)}</option>`).join('')+((v&&!l.length)?'<option value="">لا توجد نتائج</option>':'');if(v)draft.cid=l.length?s.value:'';else if(draft.cid)s.value=draft.cid}
function pinfo(){const e=$('pinfo');if(!e)return;const p=g(db.products,$('ip').value);if(!p){e.innerHTML='';return}const b=best(p),s=b&&g(db.suppliers,b.sid),q=+$('iq').value||0,sp=+$('ipr').value,sv=+p.sell||0,u=sp||sv||(b?b.price:0);let h=sv?`<div class="row best"><span>💵 سعر البيع: <b>${fmt(sv)}</b></span></div>`:'<div class="row"><b>⚠️ لا يوجد سعر بيع محفوظ لهذا المنتج</b></div>';h+=b?`<div class="row"><small>أرخص سعر شراء: ${fmt(b.price)} (${esc(s?s.name:'')})</small></div>`:'<div class="row"><small>لا يوجد سعر شراء</small></div>';if(q)h+=`<div class="row"><span>${q} × ${fmt(u)} <small>${sp?'بسعر مخصص':sv?'بسعر البيع':'بسعر الشراء'}</small></span><b>= ${fmt(q*u)}</b></div>`;e.innerHTML=h}
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n.startsWith('0')?'20'+n.slice(1):n};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function add(k,f){const o={id:uid()};for(const x of f)o[x]=$(k+'_'+x).value.trim();if(!o[f[0]])return toast('اكتب الاسم أولاً');if(k==='products'){o.prices=[];o.sell=+o.sell||0}db[k].push(o);save();render()}
function del(k,id){if(armed!==id){armed=id;render();return}armed='';db[k]=db[k].filter(x=>x.id!==id);if(k==='suppliers')db.products.forEach(p=>p.prices=p.prices.filter(x=>x.sid!==id));save();render()}
function addPrice(pid){const sid=$('s'+pid).value,pr=+$('p'+pid).value;if(!sid||!(pr>0))return toast('اختر التاجر واكتب السعر');const p=g(db.products,pid);p.prices=p.prices.filter(x=>x.sid!==sid);p.prices.push({sid,price:pr});save();render()}
function setSell(pid){const v=$('sl'+pid).value;if(v===''||+v<0)return toast('اكتب سعر البيع');g(db.products,pid).sell=+v;save();render()}
function addItem(){const pid=$('ip').value,q=+$('iq').value;if(!pid||!(q>0))return toast('اختر المنتج والكمية');const p=g(db.products,pid),b=best(p);const pr=+$('ipr').value||+p.sell||(b?b.price:0);draft.items.push({pid,qty:q,price:pr,cost:b?b.price:0});render()}
